apiVersion: apps/v1
kind: Deployment
metadata:
  name: <identificacao-app>-deployment
  labels:
    app: <identificacao-app>
spec:
  replicas: 3
  selector:
    matchLabels:
      app: <identificacao-app>
  template:
    metadata:
      labels:
        app: <identificacao-app>
    spec:
      imagePullSecrets:
      - name: <nome-secret-passo7>
      containers:
      - name: <identificacao-app>
        image: container-registry.br-se1.magalu.cloud/<nome-container-register>/<nome-instancia>:<versao>
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: <identificacao-app>-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: <identificacao-app>